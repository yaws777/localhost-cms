  --bg-card: #ffffff;
  --bg-elevated: #f1f5f9;
  --card-border: #e4e7ec;
  --input-border: #667085;
  --text-primary: #1d2939;
  --text-secondary: #566074;
  --text-on-brand: #ffffff;
  --btn-bg: #004b87;
  --table-header-bg: #e6f0fa;
  --table-header-text: #002f6c;
  --ok-bg: #dcfae6; --ok-text: #05603a; --ok-solid: #067647;
  --warn-bg: #fef0c7; --warn-text: #7a3b06; --warn-solid: #b45309;
  --crit-bg: #fee4e2; --crit-text: #912018; --crit-solid: #b42318;
  --info-bg: #e6f0fa; --info-text: #002f6c;
  --backdrop: rgba(15, 23, 42, .55);
  --focus: #004b87;
}
@media (prefers-color-scheme: dark) {

    --sti-blue-dark: #0a3d75; --sti-blue-primary: #3b82c4; --sti-blue-light: #16304a;

    --input-border: #94a3b8; --text-primary: #e2e8f0; --text-secondary: #a3b2c7;
    --btn-bg: #0a3d75; --table-header-bg: #16304a; --table-header-text: #e2e8f0;
    --ok-bg: #0b3a26; --ok-text: #a6f4c5; --ok-solid: #067647;
    --warn-bg: #4a2d08; --warn-text: #fedf89; --warn-solid: #b45309;
    --crit-bg: #4a1612; --crit-text: #fecdca; --crit-solid: #b42318;
    --info-bg: #16304a; --info-text: #cfe3f7; --backdrop: rgba(2, 6, 23, .7); --focus: #3b82c4;

  }
}
:root[data-theme="dark"] {

  --bg-page: #0f172a; --bg-card: #1e293b; --bg-elevated: #273449; --card-border: #334155;
  --input-border: #94a3b8; --text-primary: #e2e8f0; --text-secondary: #a3b2c7;
  --btn-bg: #0a3d75; --table-header-bg: #16304a; --table-header-text: #e2e8f0;
  --ok-bg: #0b3a26; --ok-text: #a6f4c5; --ok-solid: #067647;
  --warn-bg: #4a2d08; --warn-text: #fedf89; --warn-solid: #b45309;
  --crit-bg: #4a1612; --crit-text: #fecdca; --crit-solid: #b42318;
  --info-bg: #16304a; --info-text: #cfe3f7; --backdrop: rgba(2, 6, 23, .7); --focus: #3b82c4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg-page); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 1rem; line-height: 1.5;
  padding-block: 1.5rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 0.1875rem solid var(--focus); outline-offset: 0.125rem; }
svg.ic { flex-shrink: 0; }

/* Header */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.head h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.head p { color: var(--text-secondary); margin-top: .25rem; max-width: 40rem; }
.sample-note { font-size: .875rem; color: var(--text-secondary); margin-top: .25rem; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 2.75rem; min-width: 2.75rem; padding: .5rem 1rem; border-radius: .5rem;
  border: 1px solid transparent; font-weight: 600; font-size: .9375rem; white-space: nowrap;
}
.btn-primary { background: var(--btn-bg); color: var(--text-on-brand); }
.btn-primary:hover { filter: brightness(1.12); }
.btn-outline { background: var(--bg-card); color: var(--text-primary); border-color: var(--input-border); }
.btn-outline:hover { background: var(--bg-elevated); }
.btn-ghost { background: transparent; color: var(--text-primary); border-color: transparent; }
.btn-ghost:hover { background: var(--bg-elevated); }
.btn-danger { background: var(--crit-solid); color: #fff; }
.icon-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  min-width: 2.75rem; min-height: 2.75rem; border-radius: .5rem;
  background: var(--bg-card); border: 1px solid var(--input-border); color: var(--text-primary);
}
.icon-btn:hover { background: var(--bg-elevated); }
.icon-btn.needs-doc { border-color: var(--warn-solid); color: var(--warn-text); background: var(--warn-bg); }
.icon-btn .dot { position: absolute; top: .3rem; right: .3rem; width: .55rem; height: .55rem; border-radius: 50%; background: var(--crit-solid); }

/* Cards */
.card { background: var(--bg-card); border: 1px solid var(--card-border); border-radius: .75rem; padding: 1.25rem; }
.entry { display: flex; flex-direction: column; gap: 1rem; }
.entry h2 { font-size: 1.25rem; font-weight: 700; }
.entry-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .75rem; }
.entry-btn {
  display: flex; align-items: center; gap: .75rem; min-height: 4rem; padding: .75rem 1rem;
  border-radius: .625rem; border: 1px solid var(--input-border); background: var(--bg-card);
  font-weight: 600; text-align: left;
}
.entry-btn:hover { background: var(--sti-blue-light); border-color: var(--sti-blue-primary); }
.entry-btn .tile { width: 2.5rem; height: 2.5rem; border-radius: .5rem; display: grid; place-items: center; background: var(--sti-blue-light); color: var(--sti-blue-primary); }
.entry-btn.yellow .tile { background: var(--sti-yellow); color: var(--sti-blue-dark); }

.search-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
.field-row { position: relative; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.field-row .ic-in { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
.field-row input { flex: 1 1 14rem; padding-left: 2.6rem; }
input[type=text], input[type=number], input[type=time], input[type=date], select, textarea {
  width: 100%; min-height: 2.75rem; padding: .5rem .75rem; border-radius: .5rem;
  border: 1px solid var(--input-border); background: var(--bg-card); color: var(--text-primary);
}
textarea { resize: vertical; min-height: 4.5rem; }
input[readonly], input:disabled, select:disabled { background: var(--bg-elevated); color: var(--text-secondary); }
.results { margin-top: .75rem; display: flex; flex-direction: column; border: 1px solid var(--card-border); border-radius: .5rem; overflow: hidden; }
.results:empty { display: none; }
.result-row { display: flex; align-items: center; gap: .75rem; padding: .625rem .875rem; min-height: 3.25rem; background: var(--bg-card); border: 0; border-bottom: 1px solid var(--card-border); text-align: left; width: 100%; }
.result-row:last-child { border-bottom: 0; }
.result-row:hover { background: var(--sti-blue-light); }
.avatar { width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--sti-blue-light); color: var(--sti-blue-primary); display: grid; place-items: center; flex-shrink: 0; }
.rname { font-weight: 600; display: block; }
.rmeta { font-size: .875rem; color: var(--text-secondary); display: block; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .75rem; font-size: .875rem; color: var(--text-secondary); }
.chip { min-height: 2.75rem; padding: .25rem .75rem; border-radius: 999px; border: 1px solid var(--input-border); background: var(--bg-card); font-family: var(--font-mono); font-size: .875rem; }
.chip:hover { background: var(--sti-blue-light); }

/* Table */
.sec-title { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
.sec-title h2 { font-size: 1.125rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.sec-title h2 svg { color: var(--sti-blue-primary); }
.scroller { overflow-x: auto; border: 1px solid var(--card-border); border-radius: .5rem; }
table { width: 100%; border-collapse: collapse; min-width: 52rem; }
th { background: var(--table-header-bg); color: var(--table-header-text); text-align: left; font-size: .875rem; font-weight: 700; padding: .75rem; white-space: nowrap; }
td { padding: .75rem; border-top: 1px solid var(--card-border); vertical-align: middle; font-size: .9375rem; }
tr.locked td { background: color-mix(in srgb, var(--bg-elevated) 55%, transparent); }
.cell-stack { display: flex; flex-direction: column; }
.cell-stack small, td small { color: var(--text-secondary); font-size: .875rem; }
.empty { text-align: center; color: var(--text-secondary); padding: 2rem 1rem; }
.pill { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .625rem; border-radius: 999px; font-size: .875rem; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-text); }
.pill.warn { background: var(--warn-bg); color: var(--warn-text); }
.pill.info { background: var(--info-bg); color: var(--info-text); }
.pill.crit { background: var(--crit-bg); color: var(--crit-text); }
.badge { display: inline-block; padding: .2rem .6rem; border-radius: .375rem; background: var(--bg-elevated); font-size: .875rem; font-weight: 500; }
.muted { color: var(--text-secondary); }
.actions { display: flex; gap: .5rem; justify-content: center; }
.tc { text-align: center; }
.mono { font-family: var(--font-mono); }

.layer:empty { display: none; }
.backdrop { position: fixed; inset: 0; background: var(--backdrop); display: grid; place-items: center; padding: 1rem; overflow-y: auto; }
.layer.l-small .backdrop { z-index: 900; }
.layer.l-logs .backdrop { z-index: 1000; }
.layer.l-doc .backdrop { z-index: 1100; }
.layer.l-fb .backdrop { z-index: 2000; }
.modal { width: 100%; max-width: 30rem; background: var(--bg-card); color: var(--text-primary); border-radius: .75rem; overflow: hidden; box-shadow: 0 1.5rem 3rem rgba(0,0,0,.3); max-height: calc(100vh - 2rem); display: flex; flex-direction: column; }
.modal.wide { max-width: 46rem; }
.modal.xwide { max-width: 72rem; }
.mh { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .75rem 1rem; background: var(--sti-blue-dark); color: #fff; }
.mh h3 { font-size: 1.0625rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.mh.error { background: var(--crit-solid); } .mh.warning { background: var(--warn-solid); } .mh.success { background: var(--ok-solid); }
.mh .x { background: transparent; border: 0; color: #fff; min-width: 2.75rem; min-height: 2.75rem; border-radius: .5rem; display: grid; place-items: center; }
.mh .x:hover { background: rgba(255,255,255,.18); }
.mh .x:focus-visible { outline-color: var(--sti-yellow); }
.mb { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
.mf { display: flex; justify-content: flex-end; gap: .75rem; flex-wrap: wrap; }
.mf.sticky { padding: .75rem 1.25rem; border-top: 1px solid var(--card-border); background: var(--bg-card); }
.profile { text-align: center; display: flex; flex-direction: column; align-items: center; gap: .25rem; padding: 1rem; background: var(--bg-elevated); border-radius: .625rem; }
.profile svg { color: var(--sti-blue-primary); }
.profile h4 { font-size: 1.125rem; }
.timein { display: inline-flex; gap: .4rem; align-items: center; margin-top: .35rem; font-weight: 700; color: var(--sti-blue-primary); }
.alert-box { padding: .75rem 1rem; border-radius: .5rem; background: var(--warn-bg); color: var(--warn-text); display: flex; flex-direction: column; gap: .35rem; }
.alert-box .t { display: flex; gap: .5rem; align-items: center; font-weight: 700; }
.banner { display: flex; gap: .625rem; align-items: flex-start; padding: .75rem 1rem; border-radius: .5rem; background: var(--crit-bg); color: var(--crit-text); }
.banner svg { margin-top: .15rem; }
.scan-box { height: 11rem; border-radius: .625rem; background: #0b1220; position: relative; display: grid; place-items: center; color: #94a3b8; overflow: hidden; }
.scan-box::before, .scan-box::after { content: ""; position: absolute; width: 2rem; height: 2rem; border: .2rem solid var(--sti-yellow); }
.scan-box::before { top: 1rem; left: 1rem; border-right: 0; border-bottom: 0; }
.scan-box::after { bottom: 1rem; right: 1rem; border-left: 0; border-top: 0; }

/* Form */
form.doc { overflow-y: auto; display: flex; flex-direction: column; }
.fs { padding: 1.25rem; border-bottom: 1px solid var(--card-border); display: flex; flex-direction: column; gap: .75rem; }
.fs h4 { display: flex; align-items: center; gap: .5rem; font-size: 1rem; color: var(--sti-blue-primary); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .875rem; }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.full { grid-column: 1 / -1; }
.f { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.f label { font-weight: 600; font-size: .9375rem; }
.f small { color: var(--text-secondary); font-size: .875rem; }
.req { color: var(--crit-solid); }
.stock { padding: .625rem .875rem; border-radius: .5rem; background: var(--info-bg); color: var(--info-text); font-size: .9375rem; }
.flag { font-weight: 500; color: var(--text-secondary); margin-left: .5rem; }

/* Logs */
.toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; align-items: end; }
.toolbar .f.grow { grid-column: span 2; }
.summary { font-size: .9375rem; color: var(--text-secondary); }

  .toolbar .f.grow { grid-column: auto; }
  .head h1 { font-size: 1.5rem; }

@media (prefers-reduced-motion: no-preference) {
  .btn, .icon-btn, .result-row, .entry-btn { transition: background-color .15s, filter .15s; }
}

          var st = isVol(x) ? 'Stock: ' + x.stock + ' ' + plural(x.form, x.stock) + ' (' + x.rem + ' ' + unitOf(x) + ' open)' : 'Stock: ' + x.stock + ' ' + plural(x.form, x.stock);
          return '<option value="' + x.id + '"' + (x.id === fd.batch ? ' selected' : '') + ((exp || tot <= 0) ? ' disabled' : '') + '>' + esc(x.name) + ' (' + esc(withStrength(x)) + ') - Exp: ' + fmtDate(x.exp) + ' ' + (exp ? '(EXPIRED)' : '(' + st + ')') + '</option>';
        }).join('') + '</select>';
    }
    html += '</div>';
    if (b && !done) {
      html += '<div class="stock full">Current stock: ' + b.stock + ' ' + plural(b.form, b.stock) + (isVol(b) ? ' (' + b.rem + ' ' + unitOf(b) + ' remaining in open ' + b.form.toLowerCase() + ')' : '') + '.</div>';
    }
    if (fd.batch || done) {
      html += '<div class="f"><label for="qty">Dosage / Quantity' + (done ? '' : ' <span class="req">*</span>') + (!done && b && b.limit ? '<span class="flag">(max ' + b.limit + ' ' + fd.unit + ')</span>' : '') + '</label>' +
        '<input type="number" id="qty" name="qty" step="1" min="1"' + (!done && b && b.limit ? ' max="' + b.limit + '"' : '') + (done ? ' readonly disabled' : '') + ' value="' + esc(fd.qty) + '"></div>' +
        '<div class="f"><label for="unit">Unit of Measure</label><input type="text" id="unit" readonly' + (done ? ' disabled' : '') + ' value="' + esc(fd.unit) + '"></div>';
    }
    w.innerHTML = html;
  }
  function onBatchChange(id) {
    var b = batchOf(id);
    if (b) { fd.batch = id; fd.unit = unitOf(b); fd.qty = String(Math.max(1, Math.round(b.limit || 1))); }
    else { fd.batch = ''; fd.qty = ''; fd.unit = ''; }
    renderMed();
  }
  function closeDoc() {
    if (locked()) { alertModal('Documentation Required', 'Complete and save the visit documentation before closing or checking in another student.', 'warning'); return; }
    docVisit = null; renderDoc();
  }
  function submitDoc(e) {
    e.preventDefault();
    if (!docVisit) return;
    var f = fd;
    if (!f.cid || (specifyReq() && !f.specify.trim()) || !f.bp.trim() || !f.temp || !f.pulse || !f.rr || !f.iv.trim() || !f.as.trim()) {
      alertModal('Missing Required Fields', 'All required visit documentation fields must be filled out before saving.', 'warning'); return;
    }
    if (!/^\d{2,3}\/\d{2,3}$/.test(f.bp.trim())) { alertModal('Invalid Blood Pressure', 'Use the format 120/80.', 'warning'); return; }
    if (+f.temp < 30 || +f.temp > 45) { alertModal('Invalid Temperature', 'Temperature must be between 30 and 45 °C.', 'warning'); return; }
    if (+f.pulse < 30 || +f.pulse > 250) { alertModal('Invalid Pulse', 'Pulse must be between 30 and 250 bpm.', 'warning'); return; }
    if (+f.rr < 8 || +f.rr > 60) { alertModal('Invalid Respiratory Rate', 'Respiratory rate must be between 8 and 60.', 'warning'); return; }
    var b = batchOf(f.batch);
    if (!dispensed() && b && f.qty) {
      var val = Number(f.qty);
      if (isNaN(val) || val <= 0 || Math.floor(val) !== val) { alertModal('Invalid Quantity', 'Medicine dosage quantity must be a whole number greater than 0.', 'warning'); return; }
      if (new Date(b.exp) < new Date()) { alertModal('Expired Medicine', 'Cannot dispense medicine from an expired batch.', 'error'); return; }
      if (!linked(b, f.cid)) { alertModal('Medicine Not Indicated', 'The selected medicine is not linked to the selected medical condition.', 'warning'); return; }
      if (b.limit > 0 && val > b.limit) { alertModal('Dispense Limit Exceeded', 'Only up to ' + b.limit + ' ' + f.unit + ' can be dispensed at once.', 'warning'); return; }
      if (isVol(b) && val > totalAvail(b)) { alertModal('Stock Deficit', 'Requested ' + val + ' ' + f.unit + ' exceeds available stock.', 'error'); return; }
      if (!isVol(b) && val > b.stock) { alertModal('Stock Deficit', 'Requested ' + val + ' exceeds available stock (' + b.stock + ').', 'error'); return; }
    }
    var v = docVisit;
    confirmModal('Confirm Documentation', 'Save consultation details for ' + v.first + ' ' + v.last + '?', function () {
      var wasDispensed = dispensed();
      v.cid = +f.cid; v.specify = specifyReq() ? f.specify.trim() : '';
      v.bp = f.bp.trim(); v.temp = f.temp; v.pulse = f.pulse; v.rr = f.rr; v.iv = f.iv.trim(); v.as = f.as.trim();
      if (!wasDispensed && b && f.qty) {
        var q = Number(f.qty);
        if (isVol(b)) { b.rem -= q; while (b.rem < 0 && b.stock > 1) { b.stock--; b.rem += b.sv; } if (b.rem <= 0 && b.stock <= 1) { b.stock = Math.max(0, b.stock - 1); b.rem = b.stock ? b.sv : 0; } }
        else b.stock -= q;
        v.batch = b.id; v.qty = q; v.unit = f.unit;
      }
      docVisit = null; renderDoc(); renderToday(); if (logsOpen) renderLogs();
      alertModal('Documentation Saved', 'Visit documentation updated.', 'success');
    }, 'Save Details');
  }

  /* ---------- logs modal ---------- */
  function filteredLogs() {
    var q = logs.search.toLowerCase().trim();
    return VISITS.filter(function (v) {
      var name = (v.first + ' ' + v.last).toLowerCase();
      if (q && name.indexOf(q) < 0 && v.sid.toLowerCase().indexOf(q) < 0) return false;
      if (logs.from && v.date < logs.from) return false;
      if (logs.to && v.date > logs.to) return false;
      if (logs.cond && String(v.cid) !== logs.cond) return false;
      return true;
    }).sort(function (a, b) { return a.date === b.date ? b.tin.localeCompare(a.tin) : b.date.localeCompare(a.date); });
  }
  function openLogs() { logsOpen = true; renderLogs(true); }
  function renderLogs(first) {
    var el = $('layer-logs');
    if (!logsOpen) { el.innerHTML = ''; return; }
    var list = filteredLogs(), any = logs.search || logs.from || logs.to || logs.cond;
    if (first || !$('logs-body')) {
      el.innerHTML = '<div class="backdrop"><div class="modal xwide" role="dialog" aria-modal="true" aria-labelledby="lg-t">' +
        '<div class="mh"><h3 id="lg-t">' + ic('history', 20) + 'All Clinic Visit Logs History</h3><button class="x" data-act="logs-close" aria-label="Close logs" title="Close">' + ic('x', 20) + '</button></div>' +
        '<div class="mb"><div class="toolbar">' +
        '<div class="f grow"><label for="l-search">Search Student</label><input type="text" id="l-search" placeholder="Name or student ID" value="' + esc(logs.search) + '"></div>' +
        '<div class="f"><label for="l-from">From Date</label><input type="date" id="l-from" value="' + esc(logs.from) + '"></div>' +
        '<div class="f"><label for="l-to">To Date</label><input type="date" id="l-to" value="' + esc(logs.to) + '"></div>' +
        '<div class="f"><label for="l-cond">Medical Condition</label><select id="l-cond"><option value="">All</option>' + COMPLAINTS.map(function (c) { return '<option value="' + c.id + '"' + (String(c.id) === logs.cond ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="f" id="reset-wrap"></div></div>' +
        '<p class="summary" id="l-sum" role="status"></p><div class="scroller" id="logs-body"></div></div>' +
        '<div class="mf sticky"><button class="btn btn-outline" data-act="logs-close">Close Logs</button></div></div></div>';
    }
    $('reset-wrap').innerHTML = any ? '<button class="btn btn-outline" type="button" data-act="logs-reset" aria-label="Reset filters" title="Reset filters">' + ic('reset', 16) + '<span>Reset</span></button>' : '';
    $('l-sum').innerHTML = 'Showing <strong>' + list.length + '</strong> of <strong>' + VISITS.length + '</strong> clinic visit records';
    $('logs-body').innerHTML = '<table><thead><tr><th>Visit Date</th><th>Student Identity</th><th>Medical Condition</th><th>Medicine Dispensed</th><th>Time In / Out</th><th>Status</th><th class="tc">Actions</th></tr></thead><tbody>' +
      (list.length ? list.map(function (v) { return rowHtml(v, true); }).join('') : '<tr><td colspan="7" class="empty">No visit logs match the selected search or filter criteria.</td></tr>') + '</tbody></table>';
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act === 'mode') { mode = t.getAttribute('data-mode'); query = ''; renderEntry(); }
    else if (act === 'back') { mode = null; query = ''; renderEntry(); }
    else if (act === 'fill-id') { $('qr-in').value = id; $('qr-in').focus(); }
    else if (act === 'pick') { selectStudent(STUDENTS.find(function (s) { return s.id === id; })); }
    else if (act === 'refresh') { renderToday(); }
    else if (act === 'open-logs') { openLogs(); }
    else if (act === 'logs-close') { logsOpen = false; renderLogs(); }
    else if (act === 'logs-reset') { logs = { search: '', from: '', to: '', cond: '' }; renderLogs(true); }
    else if (act === 'open-doc') { openDoc(visitById(id)); }
    else if (act === 'doc-close') { closeDoc(); }
    else if (act === 'timeout-qr') { openTimeoutQr(visitById(id)); }
    else if (act === 'timeout-manual') { manualTimeout(visitById(id)); }
    else if (act === 'to-cancel') { timeoutVisit = null; $('layer-small').innerHTML = ''; }
    else if (act === 'ci-deny') { pending = null; renderCheckIn(); }
    else if (act === 'ci-ok') { confirmCheckIn(); }
    else if (act === 'fb-close') { closeFb(); }
    else if (act === 'fb-confirm') { if (fb && fb.onConfirm) fb.onConfirm(); }
  });
  document.addEventListener('submit', function (e) {
    var id = e.target.id;
    if (id === 'doc-form') submitDoc(e);
    else if (id === 'qr-form') {
      e.preventDefault();
      var val = $('qr-in').value.trim();
      if (!val) { alertModal('Enter Student ID', 'Camera is off in this preview. Type or pick a Student ID.', 'warning'); return; }
      var st = STUDENTS.find(function (s) { return s.id.toLowerCase() === val.toLowerCase(); });
      if (!st) { alertModal('Student Not Found', 'No student found matching "' + val + '".', 'warning'); return; }
      selectStudent(st);
    } else if (id === 'to-form') {
      e.preventDefault();
      var inp = $('to-in').value.trim(), v = timeoutVisit;
      if (!inp) return;
      if (inp.toUpperCase() !== v.sid.toUpperCase()) { alertModal('QR Code Mismatch', 'Scanned "' + inp + '" but expected ID ' + v.sid + '.', 'error'); $('to-in').value = ''; return; }
      timeoutVisit = null; $('layer-small').innerHTML = ''; doTimeout(v, nowHM());
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target, id = t.id;
    if (id === 'q') { query = t.value; renderResults(); }
    else if (docVisit && t.closest('#doc-form') && t.name) {
      if (t.name === 'qty') {
        var n = t.value ? String(Math.max(1, Math.floor(Number(t.value)))) : '';
        fd.qty = n; if (t.value !== n) t.value = n;
      } else if (t.name !== 'batch' && t.name !== 'cid') fd[t.name] = t.value;
    }
    else if (id === 'l-search') { logs.search = t.value; renderLogs(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, id = t.id;
    if (docVisit && id === 'cid') {
      fd.cid = t.value; fd.specify = '';
      var keep = dispensed() || linked(batchOf(fd.batch), fd.cid);
      if (!keep) { fd.batch = ''; fd.qty = ''; fd.unit = ''; }
      renderSpecify(); renderMed();
    } else if (docVisit && id === 'batch') { onBatchChange(t.value); }
    else if (id === 'l-from') { logs.from = t.value; renderLogs(); }
    else if (id === 'l-to') { logs.to = t.value; renderLogs(); }
    else if (id === 'l-cond') { logs.cond = t.value; renderLogs(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (fb) closeFb();
    else if (timeoutVisit) { timeoutVisit = null; $('layer-small').innerHTML = ''; }
    else if (pending) { pending = null; renderCheckIn(); }
    else if (docVisit) closeDoc();
    else if (logsOpen) { logsOpen = false; renderLogs(); }
  });

  /* ---------- boot ---------- */
  document.querySelectorAll('[data-ic]').forEach(function (n) { n.innerHTML = ic(n.getAttribute('data-ic'), 18); });
  renderEntry(); renderToday();
})();
</script>
